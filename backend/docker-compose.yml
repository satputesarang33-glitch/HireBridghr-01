services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirebridgehr-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/hirebridgehr?schema=public
      - JWT_ACCESS_SECRET=hirebridgehr-dev-access-super-secret-key-2026
      - JWT_REFRESH_SECRET=hirebridgehr-dev-refresh-super-secret-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hirebridgehr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hirebridgehr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
